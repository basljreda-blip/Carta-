<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación de Damasco - Carta Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4ece1;
            color: #1c352d;
            line-height: 1.6;
            padding: 20px;
            display: block;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 8px solid #1c352d;
        }
        .header {
            background-color: #1c352d;
            color: #f4ece1;
            text-align: center;
            padding: 30px 20px;
        }
        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            font-style: italic;
            opacity: 0.9;
        }
        .content {
            padding: 30px 20px;
            text-align: center;
        }
        .instruction {
            font-size: 16px;
            margin-bottom: 25px;
            color: #4a5568;
        }
        .menu-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-top: 15px;
        }
        .footer {
            background-color: #f7fafc;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #718096;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Estación de Damasco</h1>
            <p>Sabores de Siria</p>
        </div>
        
        <div class="content">
            <p class="instruction">Scan o consulta nuestra carta completa abajo. ¡Buen provecho!</p>
            <!-- La imagen está codificada en Base64 para que sea un único archivo HTML autocontenido -->
            <img class="menu-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Carta Estación de Damasco">
        </div>

        <div class="footer">
            <p>© 2026 Estación de Damasco · Auténtico Sabor Árabe</p>
        </div>
    </div>

</body>
</html>
